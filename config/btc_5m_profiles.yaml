# Same shape as the scaffolding doc's config/btc_5m_profiles.yaml, plus a
# few fields the backtest harness needs that weren't in the original (all
# marked NEW-BACKTEST below). Values are starting points, not conclusions --
# everything here should get re-tuned against real data via run_backtest.py.

profiles:
  conservative:
    total_allocation_usdc: 1000
    max_position_pct: 0.05
    daily_loss_limit_pct: 0.10
    max_trades_per_day: 5

    min_btc_move_usd: 70
    min_volume_percentile: 60
    min_realized_vol_5m: 0.0        # NOTE: doc used 0.0015 as a *fraction*;
                                     # this harness's atr_5m is in raw USD,
                                     # so recalibrate this threshold once you
                                     # see real ATR magnitudes from your data

    signal_weights:
      price_momentum: 25
      orderbook_imbalance: 20
      volume_profile: 20
      volatility_regime: 15
      funding_rate: 10
      skew_edge: 10

    min_confluence_score: 65

    kelly_fraction: 0.25
    min_trades_for_kelly: 50        # NEW-BACKTEST: small-sample guard, see README
    fallback_pct: 0.01              # NEW-BACKTEST: size used before min_trades_for_kelly is reached

    min_book_depth_usdc: 500

    taker_fee: 0.0                  # NEW-BACKTEST: verify against current Polymarket fee schedule
    assumed_polymarket_spread: 0.01 # MEASURED, not assumed: median nominal spread on the live
                                     # 5m BTC book at the decision point (scripts/
                                     # measure_execution_cost.py). Was 0.02 as a placeholder.
                                     # A marketable buy crosses ~half of this. Effective cost
                                     # rises with size: ~0.6pp for $50, ~1.7pp for $250, since
                                     # you walk the book. Sample is small (tens of snapshots) --
                                     # rerun the sampler for longer before leaning on it.
                                     # NOTE this is Polymarket's YES/NO share book, NOT the BTC
                                     # book that feeds orderbook_imbalance.
    slippage_buffer: 0.005
    fallback_fixed_pct: 0.01        # NEW-BACKTEST: fixed size used by the naive_momentum/coinflip baselines

  # MEASUREMENT ONLY -- not a trading profile, never run this live.
  #
  # Identical signal gates to `conservative`, but with the *capital* limits
  # (max trades/day, daily loss halt) lifted. Those limits exist to control
  # risk, not to select signals, and on a 114-day sample they cap the
  # backtest at 5 trades/day = ~570 trades, which is barely enough to
  # distinguish a small edge from zero. Worse, taking only the first 5
  # qualifying windows each day biases the sample toward early-UTC hours.
  # This profile answers "is there edge in the signal" with every qualifying
  # window included; `conservative` answers "what would I actually have
  # traded". Read them as different questions.
  research:
    total_allocation_usdc: 1000
    max_position_pct: 0.05
    daily_loss_limit_pct: 1.0       # no intraday halt (measurement, not risk control)
    max_trades_per_day: 288         # every 5m window in a day

    min_btc_move_usd: 70
    min_volume_percentile: 60
    min_realized_vol_5m: 0.0

    signal_weights:
      price_momentum: 25
      orderbook_imbalance: 20
      volume_profile: 20
      volatility_regime: 15
      funding_rate: 10
      skew_edge: 10

    min_confluence_score: 65

    kelly_fraction: 0.25
    min_trades_for_kelly: 50
    fallback_pct: 0.01

    min_book_depth_usdc: 500

    taker_fee: 0.0
    assumed_polymarket_spread: 0.01  # measured -- see the conservative profile
    slippage_buffer: 0.005
    fallback_fixed_pct: 0.01

  aggressive:
    total_allocation_usdc: 5000
    max_position_pct: 0.07
    daily_loss_limit_pct: 0.12
    max_trades_per_day: 10

    min_btc_move_usd: 70
    min_volume_percentile: 50
    min_realized_vol_5m: 0.0

    signal_weights:
      price_momentum: 25
      orderbook_imbalance: 20
      volume_profile: 20
      volatility_regime: 15
      funding_rate: 10
      skew_edge: 10

    min_confluence_score: 55

    kelly_fraction: 0.33
    min_trades_for_kelly: 50
    fallback_pct: 0.01

    min_book_depth_usdc: 500

    taker_fee: 0.0
    assumed_polymarket_spread: 0.01  # measured -- see the conservative profile
    slippage_buffer: 0.005
    fallback_fixed_pct: 0.01
